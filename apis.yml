aid: afilio
name: Afilio
description: 'Afilio (Afilio - Gesellschaft für Vorsorge mbH) is a Berlin-based digital
  provision platform ("Vorsorgeplattform") that helps German families prepare for
  emergencies, care situations, and death. Through a paid membership, users create
  legally valid advance directives (Patientenverfügung), healthcare powers of attorney
  (Vorsorgevollmacht), and wills (Testament), and maintain a digital inventory of
  documents and assets. A central emergency card gives doctors and relatives 24/7
  access to critical medical and provision information, and Afilio also assists with
  care-level (Pflegegrad) applications and expert consultation. Over four million
  families use the GDPR-compliant service. Afilio is a consumer (B2C) platform and
  does not currently publish a public developer API; this profile captures its public
  product, legal, and security surface. Backed by Speedinvest.'
